name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slotguard
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: slotguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U slotguard -d slotguard_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://slotguard:test-only-password@127.0.0.1:5432/slotguard_test
      TEST_DATABASE_URL: postgresql+psycopg://slotguard:test-only-password@127.0.0.1:5432/slotguard_test
      DEMO_MODE: 'true'
      ALLOWED_ORIGINS: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m ruff check . && python -m ruff format --check . && python -m pytest -q
        working-directory: backend
      - run: pnpm install --frozen-lockfile && pnpm exec prettier --check src tests && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Start synthetic app
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m slotguard.cli seed-demo
          python -m uvicorn slotguard.app:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/slotguard.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise Compose
        env:
          POSTGRES_PASSWORD: ci_only_synthetic_password_943172
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep 'SlotGuard'
      - name: Container logs
        if: failure()
        run: docker compose logs
